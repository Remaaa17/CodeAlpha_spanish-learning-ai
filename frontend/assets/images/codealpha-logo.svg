<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Globe with hexagonal pattern -->
  <g id="globe">
    <!-- Hexagons -->
    <circle cx="30" cy="30" r="28" fill="none" stroke="#0080ff" stroke-width="0.5" opacity="0.2"/>
    
    <!-- Hexagonal dots pattern -->
    <circle cx="18" cy="20" r="2.5" fill="#0080ff"/>
    <circle cx="24" cy="20" r="2.5" fill="#0080ff"/>
    <circle cx="30" cy="20" r="2.5" fill="#0080ff"/>
    <circle cx="36" cy="20" r="2.5" fill="#0080ff"/>
    <circle cx="42" cy="20" r="2.5" fill="#0080ff"/>
    
    <circle cx="15" cy="26" r="2.5" fill="#0080ff" opacity="0.9"/>
    <circle cx="21" cy="26" r="2.5" fill="#0080ff" opacity="0.9"/>
    <circle cx="27" cy="26" r="2.5" fill="#0080ff" opacity="0.9"/>
    <circle cx="33" cy="26" r="2.5" fill="#0080ff" opacity="0.9"/>
    <circle cx="39" cy="26" r="2.5" fill="#0080ff" opacity="0.9"/>
    <circle cx="45" cy="26" r="2.5" fill="#0080ff" opacity="0.8"/>
    
    <circle cx="12" cy="32" r="2.5" fill="#0080ff" opacity="0.7"/>
    <circle cx="18" cy="32" r="2.5" fill="#0080ff" opacity="0.8"/>
    <circle cx="24" cy="32" r="2.5" fill="#0080ff" opacity="0.9"/>
    <circle cx="30" cy="32" r="2.5" fill="#0080ff"/>
    <circle cx="36" cy="32" r="2.5" fill="#0080ff" opacity="0.9"/>
    <circle cx="42" cy="32" r="2.5" fill="#0080ff" opacity="0.8"/>
    <circle cx="48" cy="32" r="2" fill="#0080ff" opacity="0.5"/>
    
    <circle cx="15" cy="38" r="2.5" fill="#0080ff" opacity="0.6"/>
    <circle cx="21" cy="38" r="2.5" fill="#0080ff" opacity="0.7"/>
    <circle cx="27" cy="38" r="2.5" fill="#0080ff" opacity="0.8"/>
    <circle cx="33" cy="38" r="2.5" fill="#0080ff" opacity="0.8"/>
    <circle cx="39" cy="38" r="2.5" fill="#0080ff" opacity="0.7"/>
    <circle cx="45" cy="38" r="2" fill="#0080ff" opacity="0.4"/>
    
    <circle cx="18" cy="44" r="2" fill="#0080ff" opacity="0.4"/>
    <circle cx="24" cy="44" r="2" fill="#0080ff" opacity="0.5"/>
    <circle cx="30" cy="44" r="2.5" fill="#0080ff" opacity="0.6"/>
    <circle cx="36" cy="44" r="2" fill="#0080ff" opacity="0.5"/>
    <circle cx="42" cy="44" r="2" fill="#0080ff" opacity="0.3"/>
  </g>
  
  <!-- CODE text -->
  <text x="65" y="42" font-family="Arial, sans-serif" font-weight="bold" font-size="32" fill="#0080ff">CODE</text>
  
  <!-- ALPHA text -->
  <text x="65" y="52" font-family="Arial, sans-serif" font-weight="600" font-size="14" fill="#1e293b" letter-spacing="2">ALPHA</text>
  
  <!-- Decorative lines -->
  <line x1="65" y1="54" x2="90" y2="54" stroke="#0080ff" stroke-width="2"/>
  <line x1="155" y1="54" x2="180" y2="54" stroke="#0080ff" stroke-width="2"/>
</svg>
